  <div class="container home-start__inner">
    <header class="home-start__head">
      <p class="eyebrow" data-reveal="fade">Your turn</p>
      <h2 class="display home-start__title" id="start-title" data-split>Your lane is <span class="ink-spectrum">open</span>.</h2>
      <p class="lede home-start__sub" data-reveal data-delay="0.15">Bring one idea. Crestora brings the road.</p>
    </header>

    <div class="home-start__body">
      <form class="home-start__form" action="{{ROOT}}start.html" method="get" data-form data-demo data-reveal data-delay="0.1">
        <div class="field home-start__field">
          <label class="field__label" for="hs-idea">What are you making?</label>
          <input class="input home-start__input" id="hs-idea" name="idea" type="text" required maxlength="60" autocomplete="off" spellcheck="true" placeholder="a short film…" data-msg-required="Give it a name, even a rough one." data-ideas="a short film…|an app…|a pottery drop…|your first podcast…|a zine…" />
          <p class="field__error" id="hs-idea-error"></p>
        </div>
        <div class="field home-start__field">
          <label class="field__label" for="hs-email">Email</label>
          <input class="input home-start__input" id="hs-email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@studio.example" data-msg-required="We need an email to send your lane to." />
          <p class="field__error" id="hs-email-error"></p>
        </div>
        <button class="btn btn--primary btn--lg btn--block home-start__go" type="submit">Hit the green light<svg class="arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
        <p class="small home-start__fine">Free for 3&nbsp;lanes&nbsp;<span aria-hidden="true">·</span> No&nbsp;card&nbsp;<span aria-hidden="true">·</span> Export everything,&nbsp;always.</p>
        <p class="home-start__done" hidden><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span><span data-done-lane>Lane 001</span> is open. Type a new idea to start <span data-done-next>Lane 002</span>.</span></p>
      </form>

      <figure class="lane-card home-start__card" data-lane-card data-stage="spark" aria-label="Preview: your first lane" data-reveal="right" data-delay="0.2">
        <div class="lane-card__top">
          <span class="lane-card__no" data-lane-no>Lane 001</span>
          <span class="lane-chip lane-card__chip" data-lane-chip>Now in: Spark</span>
        </div>
        <p class="lane-card__title"><span data-lane-title>Your next thing</span><i class="lane-card__caret" aria-hidden="true"></i></p>
        <p class="lane-card__meta"><span data-lane-started>Started today</span> <span aria-hidden="true">·</span> <span data-lane-tool>Sparkboard is open</span></p>
        <div class="lane-card__road">
          <span class="stage-rail" data-n="1" data-lane-rail aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <ol class="lane-card__names" aria-hidden="true"><li class="is-lit is-now">Spark</li><li>Shape</li><li>Make</li><li>Review</li><li>Launch</li><li>Afterglow</li></ol>
        </div>
        <div class="lane-card__foot">
          <span class="lane-card__avatar" data-lane-avatar aria-hidden="true"></span>
          <span class="lane-card__who"><span class="lane-card__name" data-lane-name>Waiting for its maker</span><span class="lane-card__mail" data-lane-mail>Add your email to sign it</span></span>
        </div>
      </figure>
    </div>
  </div>
