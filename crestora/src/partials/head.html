<script>
  // Scripts will run: the page may hide what they are about to bring in. A repeat visit in this tab gets short
  // intros; reduced motion (or ?reduced) gets none.
  (function (h) {
    h.className = h.className.replace("no-js", "js");
    try { if (sessionStorage.getItem("crestora:seen")) h.classList.add("is-repeat"); } catch (e) {}
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || /[?&]reduced/.test(location.search)) h.classList.add("is-calm");
    setTimeout(function () { h.classList.add("is-ready"); }, 6000); // if the scripts never get there, show everything anyway
  })(document.documentElement);
</script>
